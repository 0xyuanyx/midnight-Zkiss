name: zkiss-backend
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: zkiss
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: zkiss
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - backend_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkiss -d zkiss"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  backend_pg:
