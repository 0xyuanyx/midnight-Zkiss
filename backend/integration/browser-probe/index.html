<!doctype html><html lang="ko"><meta charset="utf-8"><title>Midnight browser diagnostic</title>
<button id="prove">합성 참가 증명 검증</button><pre id="status">ready</pre>
<button id="keys">기기 키 저장 검증</button><pre id="key-status">ready</pre>
<script type="module">
import { deviceKey } from "/device-store.js";
const status = document.querySelector('#status');
document.querySelector('#prove').onclick = () => {
  status.textContent='running';
  const worker = new Worker('/worker.js', {type:'module'});
  worker.onmessage = e => { status.textContent=JSON.stringify(e.data); if (['proved','failed'].includes(e.data.status)) worker.terminate(); };
  worker.onerror = e => { status.textContent=JSON.stringify({status:'failed',error:e.message}); worker.terminate(); };
  worker.postMessage({});
};
document.querySelector('#keys').onclick = async () => {
  const output = document.querySelector('#key-status');
  try {
    const scope='synthetic-probe:participant:room';
    const restored=sessionStorage.getItem('key-tested')==='yes';
    const pair=await deviceKey(scope);
    const identity=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',pair.publicKey))));
    const previous=sessionStorage.getItem('public-key');
    if (restored && previous!==identity) throw Error('KEY_CHANGED_AFTER_RELOAD');
    sessionStorage.setItem('public-key',identity);
    sessionStorage.setItem('key-tested','yes');
    const peer=await crypto.subtle.generateKey({name:'X25519'},false,['deriveBits']);
    const a=await crypto.subtle.deriveBits({name:'X25519',public:peer.publicKey},pair.privateKey,256);
    const b=await crypto.subtle.deriveBits({name:'X25519',public:pair.publicKey},peer.privateKey,256);
    if (String(new Uint8Array(a))!==String(new Uint8Array(b)) || pair.privateKey.extractable) throw Error('key integrity');
    output.textContent=JSON.stringify({status:'passed',restored,extractable:pair.privateKey.extractable});
  } catch (e) { output.textContent=JSON.stringify({status:'failed',error:String(e)}); }
};
</script></html>
