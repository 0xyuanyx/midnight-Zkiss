name: zkiss-cloud
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
x-app: &app
  image: zkiss-app:local
  build:
    context: ../..
    dockerfile: deploy/gcp/Dockerfile
  restart: unless-stopped
  env_file: /opt/zkiss/config/app.env
  logging: *logging
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: /opt/zkiss/config/db.env
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zkiss -d zkiss"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging
  node:
    image: midnightntwrk/midnight-node:0.22.3
    restart: unless-stopped
    environment:
      CFG_PRESET: dev
      BASE_PATH: /node/chain
      SIDECHAIN_BLOCK_BENEFICIARY: 04bcf7ad3be7a5c790460be82a713af570f22e0f801f6659ab8e84a52be6969e
    volumes: ["chain:/node/chain"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    logging: *logging
  indexer:
    image: midnightntwrk/indexer-standalone:4.0.0
    restart: unless-stopped
    env_file: /opt/zkiss/config/indexer.env
    environment:
      APP__APPLICATION__NETWORK_ID: undeployed
      APP__INFRA__NODE__URL: ws://node:9944
      RUST_LOG: warn
    volumes: ["indexer:/data"]
    depends_on:
      node: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "cat /var/run/indexer-standalone/running"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging
  proof-server:
    image: midnightntwrk/proof-server:8.0.3
    command: ["midnight-proof-server"]
    restart: unless-stopped
    environment:
      RUST_LOG: warn
    volumes: ["proof-params:/.cache/midnight/zk-params"]
    # Some upstream versions log witness data. Never retain proof-server output.
    logging: { driver: none }
  api:
    <<: *app
    command: ["node", "--import", "tsx", "src/server.ts"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: ["node", "--import", "tsx", "src/worker-main.ts"]
    volumes: ["operator:/app/backend/midnight-level-db"]
    depends_on:
      db: { condition: service_healthy }
      node: { condition: service_healthy }
      indexer: { condition: service_healthy }
  proxy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    env_file: /opt/zkiss/config/proxy.env
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging
volumes:
  postgres:
  chain:
  indexer:
  proof-params:
  operator:
  caddy-data:
  caddy-config:
